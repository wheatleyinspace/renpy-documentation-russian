name: Deploy Sphinx to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Этот шаг автоматически создаст нужный файл прямо перед отправкой
      - name: Create .nojekyll file
        run: touch build/html/.nojekyll

      - name: Deploy Folder to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/html
          branch: gh-pages
